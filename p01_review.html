    // ============================================================
    // TAB / SHIFT+TAB INDENTATION IN PYTHON CODE BOXES
    // ============================================================

    document.addEventListener("keydown", function (event) {

        const textarea = event.target;

        // Only act inside textareas
        if (textarea.tagName !== "TEXTAREA") {
            return;
        }

        // Capture Tab instead of moving focus
        if (event.key === "Tab") {

            event.preventDefault();

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const value = textarea.value;

            // ----------------------------------------------------
            // TAB: insert four spaces
            // ----------------------------------------------------
            if (!event.shiftKey) {

                textarea.value =
                    value.substring(0, start)
                    + "    "
                    + value.substring(end);

                textarea.selectionStart =
                    textarea.selectionEnd =
                    start + 4;
            }

            // ----------------------------------------------------
            // SHIFT + TAB: remove up to four preceding spaces
            // ----------------------------------------------------
            else {

                const beforeCursor = value.substring(0, start);

                let spacesToRemove = 0;

                for (
                    let i = 1;
                    i <= 4 && start - i >= 0;
                    i++
                ) {
                    if (beforeCursor[start - i] === " ") {
                        spacesToRemove++;
                    } else {
                        break;
                    }
                }

                if (spacesToRemove > 0) {

                    textarea.value =
                        value.substring(
                            0,
                            start - spacesToRemove
                        )
                        + value.substring(end);

                    textarea.selectionStart =
                        textarea.selectionEnd =
                        start - spacesToRemove;
                }
            }
        }
    });
</script>

function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}

async function initializePython() {

    pythonStatus.textContent =
        "Loading Python environment...";


    try {

        pyodide =
            await loadPyodide();


        // NumPy is used by the current grader.
        // Additional packages can be loaded later as needed.

        await pyodide.loadPackage(
            ["numpy", "pandas", "scipy"]
        );

        pythonReady =
            true;


        pythonStatus.textContent =
            "✓ Python ready";

        pythonStatus.classList.add(
            "python-ready"
        );


        // Enable all question buttons.

        PRACTICE.questions.forEach(
            question => {

                document.getElementById(
                    `run-${question.id}`
                ).disabled = false;


                document.getElementById(
                    `check-${question.id}`
                ).disabled = false;


                document.getElementById(
                    `output-${question.id}`
                ).textContent =
                    "Python ready. You can run your code.";

            }
        );


    } catch (error) {

        pythonStatus.textContent =

        PRACTICE.questions.forEach(

            }
        );

    }

}


// ============================================================
// RESET PYTHON NAMESPACE
// ============================================================
//
// Questions should not accidentally inherit variables created
// in a different question.
//
// We keep built-ins but remove student-created globals.
//
// ============================================================

async function resetPythonNamespace() {

    await pyodide.runPythonAsync(`

protected_names = {
    "__name__",
    "__doc__",
    "__package__",
    "__loader__",
    "__spec__",
    "__annotations__",
    "__builtins__"
}

for _name in list(globals().keys()):

    if _name not in protected_names:

        globals().pop(_name, None)

`);

}


// ============================================================
// RESTORE IMPORTED VARIABLES
// ============================================================

async function restoreQuestionImports(question) {

    const imports =
        question.imports || [];


    if (imports.length === 0) {
        return;
    }


    const missing =
        imports.filter(
            name => !(name in savedExports)
        );


    if (missing.length > 0) {

        throw new Error(
            "Required output from a previous question is not available: "
            + missing.join(", ")
            + ". Check the previous question first."
        );
    }


    const payload = {};


    imports.forEach(
        name => {
            payload[name] =
                savedExports[name];
        }
    );


    pyodide.globals.set(
        "_import_payload_json",
        JSON.stringify(payload)
    );


    await pyodide.runPythonAsync(`

import json as _json
import pickle as _pickle
import base64 as _base64

_import_payload = _json.loads(
    _import_payload_json
)

for _import_name, _encoded_value in _import_payload.items():

    globals()[_import_name] = _pickle.loads(
        _base64.b64decode(
            _encoded_value.encode("ascii")
        )
    )

del _import_payload
del _import_name
del _encoded_value

`);

}


// ============================================================
// SAVE EXPORTED VARIABLES
// ============================================================

async function saveQuestionExports(question) {

    const exports =
        question.exports || [];


    if (exports.length === 0) {
        return;
    }


    // Remove previous saved versions first.
    // This prevents stale objects if the student rechecks
    // a question after deleting/changing an output.

    exports.forEach(
        name => {
            delete savedExports[name];
        }
    );


    pyodide.globals.set(
        "_export_names_json",
        JSON.stringify(exports)
    );


    const result =
        await pyodide.runPythonAsync(`

import json as _json
import pickle as _pickle
import base64 as _base64

_export_names = _json.loads(
    _export_names_json
)

_export_payload = {}

for _export_name in _export_names:

    if _export_name in globals():

        _export_payload[_export_name] = (
            _base64.b64encode(
                _pickle.dumps(
                    globals()[_export_name]
                )
            )
            .decode("ascii")
        )

_json.dumps(_export_payload)

`);


    const exported =
        JSON.parse(result);


    Object.entries(
        exported
    ).forEach(
        ([name, value]) => {

            savedExports[name] =
                value;

        }
    );

}

// ============================================================
// RUN QUESTION
// ============================================================

async function runQuestion(question) {

    if (!pythonReady) {
        return;
    }


    const runButton =
        document.getElementById(
            `run-${question.id}`
        );


    const checkButton =
        document.getElementById(
            `check-${question.id}`
        );


    const editor =
        document.getElementById(
            `editor-${question.id}`
        );


    const output =
        document.getElementById(
            `output-${question.id}`
        );


    runButton.disabled =
        true;

    checkButton.disabled =
        true;

    runButton.textContent =
        "Running...";

    output.textContent =
        "Running your code...";


    try {

        await resetPythonNamespace();


        // ----------------------------------------------------
        // Execute hidden setup code
        // ----------------------------------------------------

        if (
            question.setup_code &&
            question.setup_code.trim() !== ""
        ) {

            await pyodide.runPythonAsync(
                question.setup_code
            );

        }

        await restoreQuestionImports(
            question
        );

        let capturedOutput = "";


        pyodide.setStdout({

            batched: text => {

                capturedOutput +=
                    text + "\n";
            }
        });


        pyodide.setStderr({

            batched: text => {

                capturedOutput +=
                    text + "\n";
            }
        });


        await pyodide.runPythonAsync(
            editor.value
        );


        if (
            capturedOutput.trim() === ""
        ) {

            output.textContent =
                "✓ Code executed successfully.\n"
                + "No output was printed.";

        } else {

            output.textContent =
                "✓ Code executed successfully.\n\n"
                + capturedOutput;
        }


    } catch (error) {

        output.textContent =
            "✗ Python error:\n\n"
            + error;


    } finally {

        runButton.disabled =
            false;

        checkButton.disabled =
            false;

        runButton.textContent =
            "Run Code";
    }

}


// ============================================================
// CHECK QUESTION
// ============================================================

async function checkQuestion(question) {

    if (!pythonReady) {
        return;
    }


    const runButton =
        document.getElementById(
            `run-${question.id}`
        );


    const checkButton =
        document.getElementById(
            `check-${question.id}`
        );


    const editor =
        document.getElementById(
            `editor-${question.id}`
        );


    const output =
        document.getElementById(
            `output-${question.id}`
        );


    const assessment =
        document.getElementById(
            `assessment-${question.id}`
        );


    runButton.disabled =
        true;

    checkButton.disabled =
        true;

    checkButton.textContent =
        "Checking...";


    assessment.innerHTML = `

        <div class="assessment-title">
            Assessment
        </div>

        <div class="not-checked">
            Checking your answer...
        </div>

    `;


    try {

        // ----------------------------------------------------
        // Clean namespace
        // ----------------------------------------------------

        await resetPythonNamespace();


        // ----------------------------------------------------
        // Execute hidden setup code
        // ----------------------------------------------------

        if (
            question.setup_code &&
            question.setup_code.trim() !== ""
        ) {

            await pyodide.runPythonAsync(
                question.setup_code
            );

        }

        await restoreQuestionImports(
            question
        );

        // ----------------------------------------------------
        // Execute student code
        // ----------------------------------------------------

        await pyodide.runPythonAsync(
            editor.value
        );

        await saveQuestionExports(
            question
        );


        // ----------------------------------------------------
        // Run tests individually
        // ----------------------------------------------------

        const results = [];

        let score = 0;


        for (
            const test of question.tests
        ) {

            let passed = false;


            try {

                // Each test must assign True/False
                // to a Python variable named "passed".

                await pyodide.runPythonAsync(
                    test.code
                );


                passed =
                    Boolean(
                        pyodide.globals.get(
                            "passed"
                        )
                    );


            } catch (testError) {

                passed =
                    false;
            }


            const earnedPoints =
                passed
                ? test.points
                : 0;


            score +=
                earnedPoints;


            results.push({

                name:
                    test.name,

                passed:
                    passed,

                points:
                    earnedPoints,

                max_points:
                    test.points
            });

        }


        // ----------------------------------------------------
        // Save question state
        // ----------------------------------------------------

        questionState[
            question.id
        ] = {

            checked:
                true,

            score:
                score,

            maxScore:
                question.max_points,

            tests:
                results,

            code:
                editor.value
        };


        // ----------------------------------------------------
        // Render assessment
        // ----------------------------------------------------

        renderAssessment(
            question,
            results,
            score
        );


        // ----------------------------------------------------
        // Output
        // ----------------------------------------------------

        output.textContent =
            "✓ Code executed and answer checked.";


    } catch (error) {

        // Student code itself failed.

        questionState[
            question.id
        ] = {

            checked:
                true,

            score:
                0,

            maxScore:
                question.max_points,

            tests:
                [],

            code:
                editor.value
        };


        assessment.innerHTML = `

            <div class="assessment-title">
                Assessment
            </div>

            <div class="test-fail">
                ✗ Your code could not be executed.
            </div>

            <pre class="output-box"
                 style="margin-top:10px;">${escapeHtml(error)}</pre>

            <div class="question-score">
                Score: 0 / ${question.max_points}
            </div>

        `;


        output.textContent =
            "✗ Python error. Review the assessment below.";


    } finally {

        runButton.disabled =
            false;

        checkButton.disabled =
            false;

        checkButton.textContent =
            "Check Answer";


        updateOverallScore();
    }

}


// ============================================================
// RENDER ASSESSMENT
// ============================================================

function renderAssessment(
    question,
    results,
    score
) {

    const assessment =
        document.getElementById(
            `assessment-${question.id}`
        );


    let html = `

        <div class="assessment-title">
            Assessment
        </div>

    `;


    results.forEach(
        test => {

            const symbol =
                test.passed
                ? "✓"
                : "✗";


            const statusClass =
                test.passed
                ? "test-pass"
                : "test-fail";


            html += `

                <div class="test-row">

                    <div
                        class="test-description ${statusClass}">

                        ${symbol}
                        ${escapeHtml(test.name)}

                    </div>

                    <div class="test-points">

                        ${test.points}
                        /
                        ${test.max_points}

                    </div>

                </div>

            `;

        }
    );


    html += `

        <div class="question-score">

            Question score:
            ${score}
            /
            ${question.max_points}

        </div>

    `;


    assessment.innerHTML =
        html;
}


// ============================================================
// UPDATE OVERALL SCORE
// ============================================================

function updateOverallScore() {

    let score = 0;

    let checkedQuestions = 0;


    PRACTICE.questions.forEach(
        question => {

            const state =
                questionState[
                    question.id
                ];


            if (
                state &&
                state.checked
            ) {

                checkedQuestions += 1;

                score +=
                    state.score;
            }

        }
    );


    overallScore.textContent =
        `Score: ${score} / ${PRACTICE.max_points}`;


    const allChecked =
        checkedQuestions ===
        PRACTICE.questions.length;


    if (allChecked) {

        submitButton.disabled =
            false;


        scoreNote.textContent =
            "All questions have been checked. "
            + "You may submit this practice attempt.";

    } else {

        submitButton.disabled =
            true;


        const remaining =
            PRACTICE.questions.length
            - checkedQuestions;


        scoreNote.textContent =
            `${remaining} question`
            + (remaining === 1 ? "" : "s")
            + " still need"
            + (remaining === 1 ? "s" : "")
            + " to be checked before submission.";
    }

}


// ============================================================
// STUDENT ID VALIDATION
// ============================================================

function validStudentId(
    studentId
) {

    // Digits only.
    // Allows 6–12 digits so the template is not tied too
    // tightly to a single cohort format.

    return /^\d{6,12}$/.test(
        studentId
    );
}


// ============================================================
// BUILD SUBMISSION
// ============================================================

function buildSubmission() {

    const studentId =
        document
            .getElementById(
                "studentId"
            )
            .value
            .trim();


    const questions = {};


    PRACTICE.questions.forEach(
        question => {

            const state =
                questionState[
                    question.id
                ];


            questions[
                question.id
            ] = {

                title:
                    question.title,

                score:
                    state.score,

                max_score:
                    state.maxScore,

                code:
                    state.code,

                tests:
                    state.tests
            };

        }
    );


    let totalScore = 0;


    Object.values(
        questions
    ).forEach(
        question => {

            totalScore +=
                question.score;
        }
    );


    return {

        student_id:
            studentId,

        practice_id:
            PRACTICE.practice_id,

        practice:
            PRACTICE.title,

        score:
            totalScore,

        max_score:
            PRACTICE.max_points,

        questions:
            questions
    };

}


// ============================================================
// SUBMIT PRACTICE ATTEMPT
// ============================================================

submitButton.addEventListener(
    "click",
    async () => {

        submitStatus.textContent =
            "";

        submitStatus.className =
            "submit-status";


        // ----------------------------------------------------
        // Validate Student ID
        // ----------------------------------------------------

        const studentId =
            document
                .getElementById(
                    "studentId"
                )
                .value
                .trim();


        if (!studentId) {

            submitStatus.textContent =
                "✗ Please enter your Student ID.";

            submitStatus.classList.add(
                "submit-error"
            );

            return;
        }


        if (
            !validStudentId(
                studentId
            )
        ) {

            submitStatus.textContent =
                "✗ Please enter a valid Student ID "
                + "(digits only).";

            submitStatus.classList.add(
                "submit-error"
            );

            return;
        }


        // ----------------------------------------------------
        // Ensure all questions have been checked
        // ----------------------------------------------------

        const allChecked =
            PRACTICE.questions.every(
                question =>

                    questionState[
                        question.id
                    ].checked
            );


        if (!allChecked) {

            submitStatus.textContent =
                "✗ Check every question before submitting.";

            submitStatus.classList.add(
                "submit-error"
            );

            return;
        }


        // ----------------------------------------------------
        // Check endpoint configuration
        // ----------------------------------------------------

        if (
            SUBMIT_URL.includes(
                "PASTE_YOUR"
            )
        ) {

            submitStatus.textContent =
                "✗ Submission endpoint has not been configured.";

            submitStatus.classList.add(
                "submit-error"
            );

            return;
        }


        // ----------------------------------------------------
        // Build payload
        // ----------------------------------------------------

        const payload =
            buildSubmission();


        // ----------------------------------------------------
        // Submit
        // ----------------------------------------------------

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Submitting...";


        submitStatus.textContent =
            "Submitting your practice attempt...";


        try {

            const response =
                await fetch(
                    SUBMIT_URL,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );


            const result =
                await response.json();


            if (
                result.success
            ) {

                submitStatus.textContent =
                    `✓ Attempt ${result.attempt} `
                    + `submitted successfully. `
                    + `Score: ${payload.score}`
                    + `/${payload.max_score}.`;


                submitStatus.classList.add(
                    "submit-success"
                );


            } else {

                submitStatus.textContent =
                    "✗ Submission failed: "
                    + result.error;


                submitStatus.classList.add(
                    "submit-error"
                );
            }


        } catch (error) {

            submitStatus.textContent =
                "✗ Could not submit attempt: "
                + error;


            submitStatus.classList.add(
                "submit-error"
            );


        } finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Submit Practice Attempt";
        }

    }
);


// ============================================================
// APPLY PRACTICE MODE
// ============================================================

function applyPracticeMode() {

    const studentCard =
        document.getElementById(
            "studentCard"
        );


    // ========================================================
    // GRADED VERSION
    // ========================================================

    if (
        PRACTICE.mode === "graded"
    ) {

        studentCard.style.display =
            "block";


        submitButton.style.display =
            "inline-block";


        return;
    }


    // ========================================================
    // REVIEW VERSION
    // ========================================================

    studentCard.style.display =
        "none";


    submitButton.style.display =
        "none";


    scoreNote.innerHTML = `

        <strong>Review version.</strong>

        You may run and check your answers as many times
        as you wish.

        Results from this version are not submitted
        or recorded.

    `;


    // --------------------------------------------------------
    // Add visible review notice to header
    // --------------------------------------------------------

    const reviewNotice =
        document.createElement(
            "div"
        );


    reviewNotice.style.marginTop =
        "12px";

    reviewNotice.style.padding =
        "7px 10px";

    reviewNotice.style.background =
        "rgba(255,255,255,0.15)";

    reviewNotice.style.borderRadius =
        "5px";

    reviewNotice.style.fontSize =
        "13px";

    reviewNotice.style.display =
        "inline-block";


    reviewNotice.innerHTML =
        "<strong>Review version</strong> · "
        + "Submissions are disabled";


    document
        .querySelector(
            ".header-inner"
        )
        .appendChild(
            reviewNotice
        );

}

// ============================================================
// INITIALIZE PAGE
// ============================================================

buildHeader();

buildQuestions();

applyPracticeMode();

initializePython();


</script>
