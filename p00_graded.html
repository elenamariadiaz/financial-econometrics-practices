<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Practice 0 — Review Session</title>

<!-- =========================================================
     PYODIDE
     ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js">
</script>


<!-- =========================================================
     STYLE
     ========================================================= -->

<style>

:root {

    --comillas-blue: #004A98;
    --comillas-dark-blue: #00356E;
    --comillas-gold: #D6A900;

    --background: #F4F6F9;
    --card-background: #FFFFFF;

    --soft-blue: #EEF4FB;
    --soft-gold: #FFF8E1;
    --soft-green: #EDF8F1;
    --soft-red: #FCEEEE;

    --text-main: #2F343B;
    --text-muted: #68717D;

    --border: #D9DEE7;

    --success: #287A4B;
    --error: #B53C3C;

    --shadow:
        0 2px 8px rgba(0, 0, 0, 0.05);
}


/* =========================================================
   GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background:
        var(--background);

    color:
        var(--text-main);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    line-height: 1.55;
}


.container {

    max-width: 1050px;

    margin:
        32px auto 60px;

    padding:
        0 24px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {

    background:
        var(--comillas-blue);

    color: white;

    border-bottom:
        5px solid var(--comillas-gold);
}


.header-inner {

    max-width: 1050px;

    margin: 0 auto;

    padding:
        27px 32px 29px;
}


.course-name {

    margin: 0;

    font-size: 15px;

    font-weight: 600;

    letter-spacing:
        0.04em;

    text-transform:
        uppercase;

    opacity: 0.85;
}


.practice-title {

    margin:
        4px 0 0;

    font-size:
        29px;

    line-height:
        1.2;

    font-weight:
        700;
}


.practice-subtitle {

    margin:
        8px 0 0;

    font-size:
        15px;

    opacity:
        0.88;
}


/* =========================================================
   CARDS
   ========================================================= */

.student-card,
.practice-info-card,
.question-card,
.summary-card {

    background:
        var(--card-background);

    border:
        1px solid var(--border);

    border-radius:
        10px;

    box-shadow:
        var(--shadow);

    padding:
        24px;

    margin-bottom:
        24px;
}


.student-card {

    background:
        var(--soft-blue);

    border-left:
        4px solid var(--comillas-blue);
}


.summary-card {

    border-top:
        4px solid var(--comillas-gold);
}


/* =========================================================
   TEXT
   ========================================================= */

.section-label {

    color:
        var(--comillas-blue);

    font-size:
        12px;

    font-weight:
        700;

    text-transform:
        uppercase;

    letter-spacing:
        0.07em;

    margin-bottom:
        4px;
}


.question-title {

    color:
        var(--comillas-blue);

    font-size:
        21px;

    line-height:
        1.3;

    margin:
        2px 0 14px;
}


.instructions {

    margin-bottom:
        20px;
}


.instructions code {

    background:
        #EEF1F5;

    border-radius:
        4px;

    padding:
        2px 5px;

    font-size:
        0.95em;
}


/* =========================================================
   STUDENT ID
   ========================================================= */

.student-id-label {

    display:
        block;

    font-weight:
        600;

    margin:
        8px 0 6px;
}


.student-id {

    width:
        300px;

    max-width:
        100%;

    padding:
        10px 12px;

    border:
        1px solid #BCC5D1;

    border-radius:
        6px;

    background:
        white;

    font-size:
        15px;
}


.student-id:focus {

    outline:
        2px solid rgba(0, 74, 152, 0.18);

    border-color:
        var(--comillas-blue);
}


/* =========================================================
   CODE EDITOR
   ========================================================= */

.editor-label {

    display:
        block;

    margin:
        18px 0 7px;

    font-weight:
        600;
}


.code-editor {

    width:
        100%;

    min-height:
        260px;

    resize:
        vertical;

    padding:
        15px;

    background:
        #F8FAFC;

    border:
        1px solid #C9D1DC;

    border-radius:
        7px;

    color:
        #20252B;

    font-family:
        "Consolas",
        "Courier New",
        monospace;

    font-size:
        14px;

    line-height:
        1.5;

    tab-size:
        4;
}


.code-editor:focus {

    outline:
        2px solid rgba(0, 74, 152, 0.15);

    border-color:
        var(--comillas-blue);
}


/* =========================================================
   BUTTONS
   ========================================================= */

.button-row {

    display:
        flex;

    gap:
        10px;

    flex-wrap:
        wrap;

    margin-top:
        14px;
}


button {

    border:
        none;

    border-radius:
        6px;

    padding:
        10px 18px;

    font-size:
        14px;

    font-weight:
        600;

    cursor:
        pointer;

    transition:
        background 0.15s ease,
        opacity 0.15s ease;
}


button:disabled {

    opacity:
        0.52;

    cursor:
        not-allowed;
}


.run-button {

    background:
        var(--comillas-blue);

    color:
        white;
}


.run-button:hover:not(:disabled) {

    background:
        var(--comillas-dark-blue);
}


.check-button {

    background:
        var(--soft-gold);

    color:
        #493900;

    border:
        1px solid #E1C55E;
}


.check-button:hover:not(:disabled) {

    background:
        #FFF0B7;
}


.submit-button {

    background:
        var(--comillas-blue);

    color:
        white;

    padding:
        12px 23px;

    font-size:
        15px;
}


.submit-button:hover:not(:disabled) {

    background:
        var(--comillas-dark-blue);
}


/* =========================================================
   OUTPUT
   ========================================================= */

.output-container {

    margin-top:
        20px;
}


.output-title {

    margin-bottom:
        6px;

    font-size:
        13px;

    font-weight:
        700;

    color:
        var(--text-muted);

    text-transform:
        uppercase;

    letter-spacing:
        0.04em;
}


.output-box {

    margin:
        0;

    min-height:
        48px;

    padding:
        13px 15px;

    background:
        #F7F8FA;

    border-left:
        4px solid var(--comillas-blue);

    border-radius:
        4px;

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;

    font-family:
        "Consolas",
        "Courier New",
        monospace;

    font-size:
        13px;
}


/* =========================================================
   ASSESSMENT
   ========================================================= */

.assessment {

    margin-top:
        19px;
}


.assessment-title {

    margin-bottom:
        7px;

    font-size:
        13px;

    font-weight:
        700;

    color:
        var(--text-muted);

    text-transform:
        uppercase;

    letter-spacing:
        0.04em;
}


.not-checked {

    color:
        var(--text-muted);

    font-size:
        14px;
}


.test-row {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        20px;

    padding:
        9px 0;

    border-bottom:
        1px solid #ECEFF3;
}


.test-row:last-child {

    border-bottom:
        none;
}


.test-description {

    flex:
        1;
}


.test-points {

    white-space:
        nowrap;

    font-weight:
        600;
}


.test-pass {

    color:
        var(--success);
}


.test-fail {

    color:
        var(--error);
}


.question-score {

    margin-top:
        14px;

    padding-top:
        12px;

    border-top:
        1px solid var(--border);

    color:
        var(--comillas-blue);

    font-size:
        17px;

    font-weight:
        700;
}


/* =========================================================
   OVERALL SCORE
   ========================================================= */

.overall-score {

    margin:
        5px 0 8px;

    color:
        var(--comillas-blue);

    font-size:
        30px;

    font-weight:
        700;
}


.score-note {

    color:
        var(--text-muted);

    font-size:
        14px;

    margin-bottom:
        20px;
}


/* =========================================================
   SUBMISSION STATUS
   ========================================================= */

.submit-status {

    margin-top:
        14px;

    padding:
        0;

    font-size:
        14px;

    font-weight:
        600;
}


.submit-success {

    color:
        var(--success);
}


.submit-error {

    color:
        var(--error);
}


/* =========================================================
   PYTHON STATUS
   ========================================================= */

.python-status {

    display:
        inline-block;

    margin-top:
        8px;

    padding:
        5px 9px;

    background:
        rgba(255, 255, 255, 0.13);

    border-radius:
        4px;

    font-size:
        12px;
}


.python-ready {

    background:
        rgba(230, 255, 235, 0.18);
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    margin-top:
        40px;

    text-align:
        center;

    color:
        var(--text-muted);

    font-size:
        12px;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 700px) {

    .header-inner {

        padding:
            22px 20px;
    }


    .practice-title {

        font-size:
            24px;
    }


    .container {

        padding:
            0 14px;

        margin-top:
            20px;
    }


    .question-card,
    .student-card,
    .practice-info-card,
    .summary-card {

        padding:
            18px;
    }


    .code-editor {

        min-height:
            230px;
    }


    .test-row {

        align-items:
            flex-start;
    }

}

</style>

<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="header">

    <div class="header-inner">

        <p
            class="course-name"
            id="courseName">
        </p>

        <h1
            class="practice-title"
            id="practiceTitle">
        </h1>

        <p
            class="practice-subtitle"
            id="practiceSubtitle">
        </p>

        <div
            class="python-status"
            id="pythonStatus">
            Loading Python environment...
        </div>

    </div>

</header>


<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="container">


    <!-- =====================================================
         STUDENT
         ===================================================== -->

    <section
        class="student-card"
        id="studentCard">

        <div class="section-label">
            Student
        </div>

        <label
            class="student-id-label"
            for="studentId">
            Comillas Student ID
        </label>

        <input
            class="student-id"
            id="studentId"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Enter your Student ID"
        >

    </section>


    <!-- =====================================================
         PRACTICE INFORMATION
         ===================================================== -->

    <section
        class="practice-info-card"
        id="practiceInfoCard"
        style="display:none;">

        <div class="section-label">
            Instructions
        </div>

        <div
            id="practiceInstructions">
        </div>

    </section>


    <!-- =====================================================
         QUESTIONS ARE GENERATED HERE
         ===================================================== -->

    <div id="questionsContainer"></div>


    <!-- =====================================================
         FINAL SCORE + SUBMIT
         ===================================================== -->

    <section class="summary-card">

        <div class="section-label">
            Practice Summary
        </div>

        <div
            class="overall-score"
            id="overallScore">

            Score: 0 / 0

        </div>

        <div
            class="score-note"
            id="scoreNote">

            Check every question at least once before
            submitting a practice attempt.

        </div>


        <button
            class="submit-button"
            id="submitButton"
            disabled>

            Submit Practice Attempt

        </button>


        <div
            class="submit-status"
            id="submitStatus">
        </div>

    </section>


    <footer class="footer">

        Financial Econometrics ·
        Python Practice Grader

    </footer>

</main>

    {"practice_id": "P00", "course": "Financial Econometrics", "title": "Practice 0 — Review Session", "mode": "graded", "max_points": 10.0, "questions": [{"id": "Q1", "title": "Matrix Operations", "instructions": "\n<p>\nConsider the following matrices:\n<\/p>\n\n\\[\nA =\n\\begin{pmatrix}\n4 & 2 \\\\\n1 & 3\n\\end{pmatrix},\n\\qquad\nB =\n\\begin{pmatrix}\n2 & 1 \\\\\n5 & 4\n\\end{pmatrix}\n\\]\n\n<p>\nFirst, create the matrices <code>A<\/code> and <code>B<\/code>\nas NumPy arrays.\n<\/p>\n\n<p>\nThen create the following variables:\n<\/p>\n\n<ul>\n\n    <li>\n        <code>A_plus_B<\/code>:\n        the sum \\(A+B\\).\n    <\/li>\n\n    <li>\n        <code>AB<\/code>:\n        the matrix product \\(AB\\).\n    <\/li>\n\n    <li>\n        <code>A_inv<\/code>:\n        the inverse \\(A^{-1}\\).\n    <\/li>\n\n<\/ul>\n\n<p>\nUse matrix operations rather than hard-coding the numerical answers.\n<\/p>\n", "setup_code": "", "imports": [], "exports": [], "starter_code": "import numpy as np\n\n# Write your code below\n\n\n", "max_points": 2.0, "tests": [{"name": "Matrix A is correctly defined", "points": 0.25, "code": "\nexpected_A = np.array([\n    [4.0, 2.0],\n    [1.0, 3.0]\n])\n\npassed = (\n    \"A\" in globals()\n    and isinstance(A, np.ndarray)\n    and A.shape == (2, 2)\n    and np.allclose(A, expected_A)\n)\n"}, {"name": "Matrix B is correctly defined", "points": 0.25, "code": "\nexpected_B = np.array([\n    [2.0, 1.0],\n    [5.0, 4.0]\n])\n\npassed = (\n    \"B\" in globals()\n    and isinstance(B, np.ndarray)\n    and B.shape == (2, 2)\n    and np.allclose(B, expected_B)\n)\n"}, {"name": "A_plus_B is correct", "points": 0.4, "code": "\nexpected_A = np.array([\n    [4.0, 2.0],\n    [1.0, 3.0]\n])\n\nexpected_B = np.array([\n    [2.0, 1.0],\n    [5.0, 4.0]\n])\n\nexpected = expected_A + expected_B\n\npassed = (\n    \"A_plus_B\" in globals()\n    and isinstance(A_plus_B, np.ndarray)\n    and A_plus_B.shape == (2, 2)\n    and np.allclose(A_plus_B, expected)\n)\n"}, {"name": "AB is the correct matrix product", "points": 0.55, "code": "\nexpected_A = np.array([\n    [4.0, 2.0],\n    [1.0, 3.0]\n])\n\nexpected_B = np.array([\n    [2.0, 1.0],\n    [5.0, 4.0]\n])\n\nexpected = expected_A @ expected_B\n\npassed = (\n    \"AB\" in globals()\n    and isinstance(AB, np.ndarray)\n    and AB.shape == (2, 2)\n    and np.allclose(AB, expected)\n)\n"}, {"name": "A_inv is correct", "points": 0.55, "code": "\nexpected_A = np.array([\n    [4.0, 2.0],\n    [1.0, 3.0]\n])\n\nexpected = np.linalg.inv(expected_A)\n\npassed = (\n    \"A_inv\" in globals()\n    and isinstance(A_inv, np.ndarray)\n    and A_inv.shape == (2, 2)\n    and np.allclose(A_inv, expected)\n)\n"}]}, {"id": "Q2", "title": "Standardizing Financial Returns", "instructions": "\n<p>\nConsider the vector of financial returns below.\n<\/p>\n\n<p>\nCreate a variable called <code>z_returns<\/code> containing\nthe standardized returns according to:\n<\/p>\n\n\\[\nZ_i =\n\\frac{X_i-\\bar{X}}\n{\\hat{\\sigma}_X}\n\\]\n\n<p>\nwhere \\(\\bar{X}\\) is the sample mean and\n\\(\\hat{\\sigma}_X\\) is the <strong>sample standard deviation<\/strong>.\n<\/p>\n", "setup_code": "", "imports": [], "exports": [], "starter_code": "import numpy as np\n\nreturns = np.array([\n    0.012, -0.008, 0.015, 0.004, -0.011,\n    0.009, 0.021, -0.006, 0.003, 0.014\n])\n\n# Write your code below\n\n\n", "max_points": 2.0, "tests": [{"name": "z_returns exists", "points": 0.25, "code": "\npassed = \"z_returns\" in globals()\n"}, {"name": "z_returns has the correct dimensions", "points": 0.25, "code": "\npassed = (\n    \"z_returns\" in globals()\n    and isinstance(z_returns, np.ndarray)\n    and z_returns.shape == returns.shape\n)\n"}, {"name": "Standardized values are correct", "points": 1.0, "code": "\nexpected = (\n    returns - np.mean(returns)\n) / np.std(returns, ddof=1)\n\npassed = (\n    \"z_returns\" in globals()\n    and np.allclose(\n        z_returns,\n        expected,\n        rtol=1e-6,\n        atol=1e-8\n    )\n)\n"}, {"name": "Mean of standardized returns is approximately zero", "points": 0.25, "code": "\npassed = (\n    \"z_returns\" in globals()\n    and np.isclose(\n        np.mean(z_returns),\n        0.0,\n        atol=1e-10\n    )\n)\n"}, {"name": "Sample standard deviation is approximately one", "points": 0.25, "code": "\npassed = (\n    \"z_returns\" in globals()\n    and np.isclose(\n        np.std(z_returns, ddof=1),\n        1.0,\n        atol=1e-10\n    )\n)\n"}]}, {"id": "Q3", "title": "Normal Distribution and Cumulative Probability", "instructions": "\n<p>\nSuppose that the random variable \\(X\\) is normally distributed:\n<\/p>\n\n\\[\nX \\sim N(100,15^2)\n\\]\n\n<p>\nCalculate:\n<\/p>\n\n\\[\nP(X \\leq 130)\n\\]\n\n<p>\nCreate the following variables:\n<\/p>\n\n<ul>\n\n    <li>\n        <code>z<\/code>:\n        the standardized value corresponding to \\(x=130\\).\n    <\/li>\n\n    <li>\n        <code>cum_prob<\/code>:\n        the cumulative probability \\(P(X \\leq 130)\\).\n    <\/li>\n\n<\/ul>\n\n<p>\nYou may use <code>NormalDist()<\/code> from Python's\n<code>statistics<\/code> module to represent the standard Normal\ndistribution.\n<\/p>\n", "setup_code": "", "imports": [], "exports": [], "starter_code": "from statistics import NormalDist\n\n# Write your code below\n\n\n", "max_points": 2.0, "tests": [{"name": "z-score is correct", "points": 0.75, "code": "\nimport numpy as np\n\nexpected_z = (130 - 100) / 15\n\npassed = (\n    \"z\" in globals()\n    and np.ndim(z) == 0\n    and abs(z - expected_z) < 1e-10\n)\n"}, {"name": "Cumulative probability is correct", "points": 1.25, "code": "\nimport numpy as np\n\nexpected_prob = NormalDist().cdf(\n    (130 - 100) / 15\n)\n\npassed = (\n    \"cum_prob\" in globals()\n    and np.ndim(cum_prob) == 0\n    and abs(cum_prob - expected_prob) < 1e-6\n)\n"}]}, {"id": "Q4", "title": "Descriptive Statistics and Association", "instructions": "\n<p>\nThe arrays below contain returns for two assets,\ te your code below\n\n\n", "max_points": 2.0, "tests": [{"name": "Future value is correct", "points": 0.75, "code": "\nexpected_fv = (\n    5000\n    * (1 + 0.04) ** 5\n)\n\npassed = (\n    \"future_value\" in globals()\n    and np.ndim(future_value) == 0\n    and np.isclose(\n        future_value,\n        expected_fv\n    )\n)\n"}, {"name": "Net present value is correct", "points": 1.25, "code": "\nexpected_npv = (\n    -8000\n    + 2500 / (1 + 0.06) ** 1\n    + 3000 / (1 + 0.06) ** 2\n    + 3500 / (1 + 0.06) ** 3\n)\n\npassed = (\n    \"npv\" in globals()\n    and np.ndim(npv) == 0\n    and np.isclose(\n        npv,\n        expected_npv\n    )\n)\n"}]}], "subtitle": "Python warm-up and review of essential prerequisites", "instructions": "\n<p>\nThis practice reviews some of the mathematical, statistical,\nand financial concepts covered in the Review Session.\n<\/p>\n\n<p>\nYou may <strong>run<\/strong> and <strong>check<\/strong> your answers\nas many times as you wish before submitting a practice attempt.\n<\/p>\n\n<p>\nEach question is independent. Your practice score is calculated\nfrom the most recently checked version of each question.\n<\/p>\n"};

// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}

// ============================================================
// RESET PYTHON NAMESPACE
// ============================================================
//
// Questions should not accidentally inherit variables created
// in a different question.
//
// We keep built-ins but remove student-created globals.
//
// ============================================================

async function resetPythonNamespace() {

    await pyodide.runPythonAsync(`

protected_names = {
    "__name__",
    "__doc__",
    "__package__",
    "__loader__",
    "__spec__",
    "__annotations__",
    "__builtins__"
}

for _name in list(globals().keys()):

    if _name not in protected_names:

        globals().pop(_name, None)

`);

}


// ============================================================
// RESTORE IMPORTED VARIABLES
// ============================================================

async function restoreQuestionImports(question) {

    const imports =
        question.imports || [];


    if (imports.length === 0) {
        return;
    }


    const missing =
        imports.filter(
            name => !(name in savedExports)
        );


    if (missing.length > 0) {

        throw new Error(
            "Required output from a previous question is not available: "
            + missing.join(", ")
            + ". Check the previous question first."
        );
    }


    const payload = {};


    imports.forEach(
        name => {
            payload[name] =
                savedExports[name];
        }
    );


    pyodide.globals.set(
        "_import_payload_json",
        JSON.stringify(payload)
    );


    await pyodide.runPythonAsync(`

import json as _json
import pickle as _pickle
import base64 as _base64

_import_payload = _json.loads(
    _import_payload_json
)

for _import_name, _encoded_value in _import_payload.items():

    globals()[_import_name] = _pickle.loads(
        _base64.b64decode(
            _encoded_value.encode("ascii")
        )
    )

del _import_payload
del _import_name
del _encoded_value

`);

}


// ============================================================
// SAVE EXPORTED VARIABLES
// ============================================================

async function saveQuestionExports(question) {

    const exports =
        question.exports || [];


    if (exports.length === 0) {
        return;
    }


    // Remove previous saved versions first.
    // This prevents stale objects if the student rechecks
    // a question after deleting/changing an output.

    exports.forEach(
        name => {
            delete savedExports[name];
        }
    );


    pyodide.globals.set(
        "_export_names_json",
        JSON.stringify(exports)
    );


    const result =
        await pyodide.runPythonAsync(`

import json as _json
import pickle as _pickle
import base64 as _base64

_export_names = _json.loads(
    _export_names_json
)

_export_payload = {}

for _export_name in _export_names:

    if _export_name in globals():

        _export_payload[_export_name] = (
            _base64.b64encode(
                _pickle.dumps(
                    globals()[_export_name]
                )
            )
            .decode("ascii")
        )

_json.dumps(_export_payload)

`);


    const exported =
        JSON.parse(result);


    Object.entries(
        exported
    ).forEach(
        ([name, value]) => {

            savedExports[name] =
                value;

        }
    );

}

// ============================================================
// RUN QUESTION
// ============================================================

async function runQuestion(question) {

    if (!pythonReady) {
        return;
    }


    const runButton =
        document.getElementById(
            `run-${question.id}`
        );


    const checkButton =
        document.getElementById(
            `check-${question.id}`
        );


    const editor =
        document.getElementById(
            `editor-${question.id}`
        );


    const output =
        document.getElementById(
            `output-${question.id}`
        );


    runButton.disabled =
        true;

    checkButton.disabled =
        true;

    runButton.textContent =
        "Running...";

    output.textContent =
        "Running your code...";


    try {

        await resetPythonNamespace();


        // ----------------------------------------------------
        // Execute hidden setup code
        // ----------------------------------------------------

        if (
            question.setup_code &&
            question.setup_code.trim() !== ""
        ) {

            await pyodide.runPythonAsync(
                question.setup_code
            );

        }

        await restoreQuestionImports(
            question
        );

        let capturedOutput = "";


        pyodide.setStdout({

            batched: text => {

                capturedOutput +=
                    text + "\n";
            }
        });


        pyodide.setStderr({

            batched: text => {

                capturedOutput +=
                    text + "\n";
            }
        });


        await pyodide.runPythonAsync(
            editor.value
        );


        if (
            capturedOutput.trim() === ""
        ) {

            output.textContent =
                "✓ Code executed successfully.\n"
                + "No output was printed.";

        } else {

            output.textContent =
                "✓ Code executed successfully.\n\n"
                + capturedOutput;
        }


    } catch (error) {

        output.textContent =
            "✗ Python error:\n\n"
            + error;


    } finally {

        runButton.disabled =
            false;

        checkButton.disabled =
            false;

        runButton.textContent =
            "Run Code";
    }

}


// ============================================================
// CHECK QUESTION
// ============================================================

async function checkQuestion(question) {

    if (!pythonReady) {
        return;
    }


    const runButton =
        document.getElementById(
            `run-${question.id}`
        );


    const checkButton =
        document.getElementById(
            `check-${question.id}`
        );


    const editor =
        document.getElementById(
            `editor-${question.id}`
        );


    const output =
        document.getElementById(
            `output-${question.id}`
        );


    const assessment =
        document.getElementById(
            `assessment-${question.id}`
        );


    runButton.disabled =
        true;

    checkButton.disabled =
        true;

    checkButton.textContent =
        "Checking...";


    assessment.innerHTML = `

        <div class="assessment-title">
            Assessment
        </div>

        <div class="not-checked">
            Checking your answer...
        </div>

    `;


    try {

        // ----------------------------------------------------
        // Clean namespace
        // ----------------------------------------------------

        await resetPythonNamespace();


        // ----------------------------------------------------
        // Execute hidden setup code
        // ----------------------------------------------------

        if (
            question.setup_code &&
            question.setup_code.trim() !== ""
        ) {

            await pyodide.runPythonAsync(
                question.setup_code
            );

        }

        await restoreQuestionImports(
            question
        );

        // ----------------------------------------------------
        // Execute student code
        // ----------------------------------------------------

        await pyodide.runPythonAsync(
            editor.value
        );

        await saveQuestionExports(
            question
        );


        // ----------------------------------------------------
        // Run tests individually
        // ----------------------------------------------------

        const results = [];

        let score = 0;


        for (
            const test of question.tests
        ) {

            let passed = false;


            try {

                // Each test must assign True/False
                // to a Python variable named "passed".

                await pyodide.runPythonAsync(
                    test.code
                );


                passed =
                    Boolean(
                        pyodide.globals.get(
                            "passed"
                        )
                    );


            } catch (testError) {

                passed =
                    false;
            }


            const earnedPoints =
                passed
                ? test.points
                : 0;


            score +=
                earnedPoints;


            results.push({

                name:
                    test.name,

                passed:
                    passed,

                points:
                    earnedPoints,

                max_points:
                    test.points
            });

        }


        // ----------------------------------------------------
        // Save question state
        // ----------------------------------------------------

        questionState[
            question.id
        ] = {

            checked:
                true,

            score:
                score,

            maxScore:
                question.max_points,

            tests:
                results,

            code:
                editor.value
        };


        // ----------------------------------------------------
        // Render assessment
        // ----------------------------------------------------

        renderAssessment(
            question,
            results,
            score
        );


        // ----------------------------------------------------
        // Output
        // ----------------------------------------------------

        output.textContent =
            "✓ Code executed and answer checked.";


    } catch (error) {

        // Student code itself failed.

        questionState[
            question.id
        ] = {

            checked:
                true,

            score:
                0,

            maxScore:
                question.max_points,

            tests:
                [],

            code:
                editor.value
        };


        assessment.innerHTML = `

            <div class="assessment-title">
                Assessment
            </div>

            <div class="test-fail">
                ✗ Your code could not be executed.
            </div>

            <pre class="output-box"
                 style="margin-top:10px;">${escapeHtml(error)}</pre>

            <div class="question-score">
                Score: 0 / ${question.max_points}
            </div>

        `;


        output.textContent =
            "✗ Python error. Review the assessment below.";


    } finally {

        runButton.disabled =
            false;

        checkButton.disabled =
            false;

        checkButton.textContent =
            "Check Answer";


        updateOverallScore();
    }

}


// ============================================================
// RENDER ASSESSMENT
// ============================================================

function renderAssessment(
    question,
    results,
    score
) {

    const assessment =
        document.getElementById(
            `assessment-${question.id}`
        );


    let html = `

        <div class="assessment-title">
            Assessment
        </div>

    `;


    results.forEach(
        test => {

            const symbol =
                test.passed
                ? "✓"
                : "✗";


            const statusClass =
                test.passed
                ? "test-pass"
                : "test-fail";


            html += `

                <div class="test-row">

                    <div
                        class="test-description ${statusClass}">

                        ${symbol}
                        ${escapeHtml(test.name)}

                    </div>

                    <div class="test-points">

                        ${test.points}
                        /
                        ${test.max_points}

                    </div>

                </div>

            `;

        }
    );


    html += `

        <div class="question-score">

            Question score:
            ${score}
            /
            ${question.max_points}

        </div>

    `;


    assessment.innerHTML =
        html;
}


// ============================================================
// UPDATE OVERALL SCORE
// ============================================================

function updateOverallScore() {

    let score = 0;

    let checkedQuestions = 0;


    PRACTICE.questions.forEach(
        question => {

            const state =
                questionState[
                    question.id
                ];


            if (
                state &&
                state.checked
            ) {

                checkedQuestions += 1;

                score +=
                    state.score;
            }

        }
    );


    overallScore.textContent =
        `Score: ${score} / ${PRACTICE.max_points}`;


    const allChecked =
        checkedQuestions ===
        PRACTICE.questions.length;


    if (allChecked) {

        submitButton.disabled =
            false;


        scoreNote.textContent =
            "All questions have been checked. "
            + "You may submit this practice attempt.";

    } else {

        submitButton.disabled =
            true;


        const remaining =
            PRACTICE.questions.length
            - checkedQuestions;


        scoreNote.textContent =
            `${remaining} question`
            + (remaining === 1 ? "" : "s")
            + " still need"
            + (remaining === 1 ? "s" : "")
            + " to be checked before submission.";
    }

}


// ============================================================
// STUDENT ID VALIDATION
// ============================================================

function validStudentId(
    studentId
) {

    // Digits only.
    // Allows 6–12 digits so the template is not tied too
    // tightly to a single cohort format.

    return /^\d{6,12}$/.test(
        studentId
    );
}


// ============================================================
// BUILD SUBMISSION
// ============================================================

function buildSubmission() {

    const studentId =
        document
            .getElementById(
                "studentId"
            )
            .value
            .trim();


    const questions = {};


    PRACTICE.questions.forEach(
        question => {

            const state =
                questionState[
                    question.id
                ];


            questions[
                question.id
            ] = {

                title:
                    question.title,

                score:
                    state.score,

                max_score:
                    state.maxScore,

                code:
                    state.code,

                tests:
                    state.tests
            };

        }
    );


    let totalScore = 0;


    Object.values(
        questions
    ).forEach(
        question => {

            totalScore +=
                question.score;
        }
    );


    return {

        student_id:
            studentId,

        practice_id:
            PRACTICE.practice_id,

        practice:
            PRACTICE.title,

        score:
            totalScore,

        max_score:
            PRACTICE.max_points,

        questions:
            questions
    };

}


// ============================================================
// SUBMIT PRACTICE ATTEMPT
// ============================================================

submitButton.addEventListener(
    "click",
    async () => {

        submitStatus.textContent =
            "";

        submitStatus.className =
            "submit-status";


        // ----------------------------------------------------
        // Validate Student ID
        // ----------------------------------------------------

        const studentId =
            document
                .getElementById(
                    "studentId"
                )
                .value
                .trim();


        if (!studentId) {

            submitStatus.textContent =
                "✗ Please enter your Student ID.";

            submitStatus.classList.add(
                "submit-error"
            );

            return;
        }


        if (
            !validStudentId(
                studentId
            )
        ) {

            submitStatus.textContent =
                "✗ Please enter a valid Student ID "
                + "(digits only).";

            submitStatus.classList.add(
                "submit-error"
            );

            return;
        }


        // ----------------------------------------------------
        // Ensure all questions have been checked
        // ----------------------------------------------------

        const allChecked =
            PRACTICE.questions.every(
                question =>

                    questionState[
                        question.id
                    ].checked
            );


        if (!allChecked) {

            submitStatus.textContent =
                "✗ Check every question before submitting.";

            submitStatus.classList.add(
                "submit-error"
            );

            return;
        }


        // ----------------------------------------------------
        // Check endpoint configuration
        // ----------------------------------------------------

        if (
            SUBMIT_URL.includes(
                "PASTE_YOUR"
            )
        ) {

            submitStatus.textContent =
                "✗ Submission endpoint has not been configured.";

            submitStatus.classList.add(
                "submit-error"
            );

            return;
        }


        // ----------------------------------------------------
        // Build payload
        // ----------------------------------------------------

        const payload =
            buildSubmission();


        // ----------------------------------------------------
        // Submit
        // ----------------------------------------------------

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Submitting...";


        submitStatus.textContent =
            "Submitting your practice attempt...";


        try {

            const response =
                await fetch(
                    SUBMIT_URL,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );


            const result =
                await response.json();


            if (
                result.success
            ) {

                submitStatus.textContent =
                    `✓ Attempt ${result.attempt} `
                    + `submitted successfully. `
                    + `Score: ${payload.score}`
                    + `/${payload.max_score}.`;


                submitStatus.classList.add(
                    "submit-success"
                );


            } else {

                submitStatus.textContent =
                    "✗ Submission failed: "
                    + result.error;


                submitStatus.classList.add(
                    "submit-error"
                );
            }


        } catch (error) {

            submitStatus.textContent =
                "✗ Could not submit attempt: "
                + error;


            submitStatus.classList.add(
                "submit-error"
            );


        } finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Submit Practice Attempt";
        }

    }
);


// ============================================================
// APPLY PRACTICE MODE
// ============================================================

function applyPracticeMode() {

    const studentCard =
        document.getElementById(
            "studentCard"
        );


    // ========================================================
    // GRADED VERSION
    // ========================================================

    if (
        PRACTICE.mode === "graded"
    ) {

        studentCard.style.display =
            "block";


        submitButton.style.display =
            "inline-block";


        return;
    }


    // ========================================================
    // REVIEW VERSION
    // ========================================================

    studentCard.style.display =
        "none";


    submitButton.style.display =
        "none";


    scoreNote.innerHTML = `

        <strong>Review version.</strong>

        You may run and check your answers as many times
        as you wish.

        Results from this version are not submitted
        or recorded.

    `;


    // --------------------------------------------------------
    // Add visible review notice to header
    // --------------------------------------------------------

    const reviewNotice =
        document.createElement(
            "div"
        );


    reviewNotice.style.marginTop =
        "12px";

    reviewNotice.style.padding =
        "7px 10px";

    reviewNotice.style.background =
        "rgba(255,255,255,0.15)";

    reviewNotice.style.borderRadius =
        "5px";

    reviewNotice.style.fontSize =
        "13px";

    reviewNotice.style.display =
        "inline-block";


    reviewNotice.innerHTML =
        "<strong>Review version</strong> · "
        + "Submissions are disabled";


    document
        .querySelector(
            ".header-inner"
        )
        .appendChild(
            reviewNotice
        );

}

// ============================================================
// INITIALIZE PAGE
// ============================================================

buildHeader();

buildQuestions();

applyPracticeMode();

initializePython();


</script>
